    <rect x="225.1" y="609" width="119.8" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.5"/>
    <text class="node-title" x="285" y="651">Home</text>

    <rect x="388.6" y="609" width="154.7" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.48"/>
    <text class="node-title" x="466" y="651">Products</text>

    <rect x="574.4" y="609" width="155.3" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.46"/>
    <text class="node-title" x="652" y="651">About Us</text>

    <rect x="762.6" y="609" width="142.8" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.44"/>
    <text class="node-title" x="834" y="651">Contact</text>

    <rect x="511" y="841" width="112" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.42"/>
    <text class="node-title" x="567" y="883">Shop</text>

    <rect x="271.1" y="1073" width="139.7" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.48"/>
    <text class="node-title" x="341" y="1115">Tutorial</text>

    <rect x="502.1" y="1073" width="157.8" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.5"/>
    <text class="node-title" x="581" y="1115">Selection</text>

    <rect x="769.1" y="1073" width="103.8" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.46"/>
    <text class="node-title" x="821" y="1115">Cart</text>

    <rect x="244.6" y="1305" width="142.8" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.5"/>
    <text class="node-title" x="316" y="1347">Contact</text>

    <rect x="473.8" y="1305" width="146.4" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.48"/>
    <text class="node-title" x="547" y="1347">Address</text>

    <rect x="705.6" y="1305" width="184.9" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.46"/>
    <text class="node-title" x="798" y="1347">Date &amp; Time</text>

    <rect x="226" y="1537" width="238.9" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.5"/>
    <text class="node-title" x="345.5" y="1579">Payment Method</text>

    <rect x="500" y="1537" width="192.9" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.48"/>
    <text class="node-title" x="596.5" y="1579">Details Input</text>

    <rect x="740" y="1537" width="198.8" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.46"/>
    <text class="node-title" x="839.4" y="1565">Confirmation</text>
    <text class="node-title" x="839.4" y="1592">Prompt</text>

    <rect x="448.2" y="1769" width="237.7" height="84" rx="8" fill="url(#nodeFill)" stroke="#43ff92" stroke-opacity="0.5"/>
    <text class="node-title" x="567" y="1797">Thank You</text>
    <text class="node-title" x="567" y="1824">Order Confirmed</text>
  </g>

