<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Outlined lock</title>
  <defs>
    <filter id="lock-outline" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240">
      <feComponentTransfer in="SourceAlpha" result="solid-alpha">
        <feFuncA type="linear" slope="1000" intercept="0" />
      </feComponentTransfer>
      <feMorphology in="solid-alpha" operator="dilate" radius="2" result="expanded-alpha" />
      <feComposite in="expanded-alpha" in2="solid-alpha" operator="out" result="outline-alpha" />
      <feFlood flood-color="#fff" flood-opacity="0.9" result="outline-color" />
      <feComposite in="outline-color" in2="outline-alpha" operator="in" />
    </filter>
    <mask id="lock-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <path d="M62 88V67.2C62 48.64 78.8 35.2 100 35.2S138 48.64 138 67.2V88" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="26" />
      <rect x="11.85" y="88.6" width="176.3" height="84.8" rx="20" fill="#fff" />
      <circle cx="100" cy="131" r="28.2" fill="#000" />
    </mask>
  </defs>
  <g filter="url(#lock-outline)">
    <rect width="200" height="200" fill="#fff" mask="url(#lock-mask)" />
  </g>
</svg>
